[build]
  command = "npm run build"
  publish = ".next"
  base = "."
  ignore = ["worker-database/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect /api/cleanup-transactions to Netlify Function
[[redirects]]
  from = "/api/cleanup-transactions"
  to = "/.netlify/functions/cleanup-transactions"
  status = 200
  force = true

# Functions configuration
[functions]
  directory = "netlify/functions"

  [functions.scheduled-cleanup]
    schedule = "@daily" # Runs once per day at midnight 