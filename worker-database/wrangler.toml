name = "sybil-transfer-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# D1 binding
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "sybil-transfer-db"
database_id = "ad53ab51-d14a-4485-a581-d0e37d68c51d"

# ---------------------------------------------------------------------------
# Environment variables (NON-SECRET — safe to commit)
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://sybil-transfer.netlify.app,http://localhost:3000"
ADMIN_USER_IDS = ""

# ---------------------------------------------------------------------------
# SECRET environment variables — DO NOT put values here!
# Set them with: wrangler secret put JWT_SECRET
#                 wrangler secret put CLEANUP_API_KEY
# ---------------------------------------------------------------------------
# JWT_SECRET             — Generate with: openssl rand -hex 32
# CLEANUP_API_KEY        — bearer token for the cleanup cron job

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
[observability]
enabled = true

# ---------------------------------------------------------------------------
# Staging environment (optional)
# ---------------------------------------------------------------------------
[env.staging]
name = "sybil-transfer-worker-staging"
vars = { ENVIRONMENT = "staging", ALLOWED_ORIGINS = "https://staging.your-app.netlify.app,http://localhost:3000" }
